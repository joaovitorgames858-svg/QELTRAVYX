name: Runtime total - host regressions
on:
  workflow_dispatch:
  pull_request:
    paths: ['ci/**', 'lib/**', 'test/**', 'android/**', '.github/workflows/runtime-total-*.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host regressions (not Android evidence)
        run: python3 -m unittest discover -s ci/tests -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
