name: Runtime total - Android Bionic Node candidate
# Manual, isolated from UX V3. No push, signing, installation or release publishing.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/runtime-total
    paths:
      - '.github/workflows/runtime-total-native.yml'
      - 'ci/runtime/**'
      - 'android/**'
      - 'lib/**'
permissions:
  contents: read
concurrency:
  group: runtime-total-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    # Heavy Node/V8 Bionic build: run only for manual dispatch or an explicitly
    # marked one-shot push. Normal Git pushes keep the fast Git build only.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-node]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'ndk;28.2.13676358'
      - name: Compile Node and package matching complete npm CLI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash ci/runtime/build_node.sh
      - name: Source provenance and checksums; Android test still required
        uses: actions/upload-artifact@v4
        with:
          name: qeltravyx-node-android-candidate
          path: .build/runtime-bundle/
          retention-days: 7
          if-no-files-found: error
  git:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'ndk;28.2.13676358'
      - name: Compile local-only Git candidate
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash ci/runtime/build_git.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qeltravyx-git-android-candidate
          path: .build/git-bundle/
          retention-days: 7
          if-no-files-found: error
  apk-candidate:
    needs: [node, git]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qeltravyx-node-android-candidate
          path: .build/node-bundle
      - uses: actions/download-artifact@v4
        with:
          name: qeltravyx-git-android-candidate
          path: .build/git-bundle
      - name: Verify and stage candidate bundles (no stable artifact touched)
        run: python3 ci/runtime/stage_bundle.py .build/node-bundle .build/git-bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Patch pip only in the disposable CI checkout
        run: python3 ci/patch_pip_android_alias.py
      - name: Remove CI signing and prepare versionCode 45 (after tested +44)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          old='signingConfig = signingConfigs.getByName("debug")'
          s=p.read_text(); assert s.count(old)==1
          p.write_text(s.replace(old,'// Candidate unsigned; sign locally after validation'))
          assert 'version: 1.0.17+43' in Path('pubspec.yaml').read_text()
          PY
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.versionName=1.0.17\nflutter.versionCode=45\n' "$ANDROID_SDK_ROOT" "$FLUTTER_SDK" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build exactly one unsigned ARM64 candidate
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --max-workers=2 --console=plain -Ptarget-platform=android-arm64
      - name: Verify Node, npm, Git, and version 45 in unsigned APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=$(find build/app/outputs -type f -name '*unsigned*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -E "^package: name='dev.qeltravyx.qeltravyx' versionCode='45' "
          python3 - "$APK" <<'PY_VERIFY_APK'
          import hashlib,sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          root=Path('android/app/src/main')
          native=['libqeltravyx_node.so','libqeltravyx_git.so']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'APK ZIP corrupted'
              for name in native:
                  apk_name='lib/arm64-v8a/'+name
                  source=root/'jniLibs/arm64-v8a'/name
                  actual=z.read(apk_name)
                  assert hashlib.sha256(actual).digest()==hashlib.sha256(source.read_bytes()).digest(), name+' differs'
              assert z.getinfo('assets/flutter_assets/assets/qeltravyx/npm/npm-runtime.zip').file_size>0 if 'assets/flutter_assets/assets/qeltravyx/npm/npm-runtime.zip' in z.namelist() else True
              print('Node and Git native bytes verified; npm assets checked in staging')
          PY_VERIFY_APK
          cp "$APK" artifacts/QELTRAVYX-NODE-NPM-GIT-V45-unsigned.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: QELTRAVYX-NODE-NPM-GIT-V45-UNSIGNED-NOT-DEVICE-VALIDATED
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  git-apk-candidate:
    # Independent from Node.js: package the Git candidate without waiting
    # for the expensive experimental Node/V8 cross-compilation.
    needs: [git]
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[build-node]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download Git native candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: qeltravyx-git-android-candidate
          path: .build/git-bundle
      - name: Verify checksum, Android ELF, and stage in disposable checkout
        run: |
          python3 ci/runtime/stage_bundle.py .build/git-bundle
          test -s android/app/src/main/jniLibs/arm64-v8a/libqeltravyx_git.so
          python3 ci/runtime/verify_elf.py android/app/src/main/jniLibs/arm64-v8a/libqeltravyx_git.so
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android build dependencies
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Flutter dependencies and tests
        run: |
          flutter pub get
          flutter test
      - name: Patch offline pip policy in CI checkout only
        run: python3 ci/patch_pip_android_alias.py
      - name: Produce unsigned versionCode 44 without changing stable branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          old='signingConfig = signingConfigs.getByName("debug")'
          assert s.count(old)==1, 'Unexpected signing configuration'
          p.write_text(s.replace(old, '// Git-only candidate unsigned; sign locally on Android'))
          assert 'version: 1.0.17+43' in Path('pubspec.yaml').read_text()
          PY
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.versionName=1.0.17\nflutter.versionCode=44\n' \
            "$ANDROID_SDK_ROOT" "$FLUTTER_SDK" > android/local.properties
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile Git-only Android ARM64 APK
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            -Ptarget-platform=android-arm64
      - name: Check APK version, package ID, and exact Git ELF bytes
        run: |
          set -e
          APK="$(find build/app/outputs -type f -name '*unsigned*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -3
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -E "^package: name='dev.qeltravyx.qeltravyx' versionCode='44' "
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libqeltravyx_git.so'
          EMBEDDED="$(unzip -p "$APK" lib/arm64-v8a/libqeltravyx_git.so | sha256sum | cut -d' ' -f1)"
          ORIGINAL="$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libqeltravyx_git.so | cut -d' ' -f1)"
          test "$EMBEDDED" = "$ORIGINAL"
          mkdir -p artifacts
          cp "$APK" artifacts/QELTRAVYX-GIT-UXV3-v44-unsigned.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
          echo "Git ELF embedded identically; unsigned APK versionCode=44"
      - name: Publish test-only unsigned Git APK
        uses: actions/upload-artifact@v4
        with:
          name: QELTRAVYX-GIT-UXV3-V44-UNSIGNED-TEST
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
